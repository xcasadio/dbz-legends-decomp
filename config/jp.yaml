      - config/symbols.select.jp.txt
      - config/sym_extern.jp.txt
    vram_start: 0x800A0000  # TODO: Determine actual load address
    segments:
      - [0x0, c, select]

  # VS mode overlay
  - name: vs
    disk_path: disks/jp/VS.EXE
    sha1: # TODO: Calculate SHA1 hash
    base_path: vs
    symbol_addrs_path:
      - config/symbols.vs.jp.txt
      - config/sym_extern.jp.txt
    vram_start: 0x800A0000  # TODO: Determine actual load address
    segments:
      - [0x0, c, vs]

  # Special mode overlay
  - name: sp
    disk_path: disks/jp/SP.EXE
    sha1: # TODO: Calculate SHA1 hash
    base_path: sp
    symbol_addrs_path:
