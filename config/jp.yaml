  # Demo overlay
  - name: demo
    disk_path: disks/jp/DEMO.EXE
    sha1: # TODO: Calculate SHA1 hash
    base_path: demo
    symbol_addrs_path:
      - config/symbols.demo.jp.txt
      - config/sym_extern.jp.txt
    vram_start: 0x800A0000  # TODO: Determine actual load address
    segments:
      - [0x0, c, demo]

  # Movie player overlay
  - name: movie
    disk_path: disks/jp/MOVIE.EXE
    sha1: # TODO: Calculate SHA1 hash
    base_path: movie
    symbol_addrs_path:
      - config/symbols.movie.jp.txt
